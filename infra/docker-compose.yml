# Entorno de desarrollo de NoteCore: PostgreSQL + API + web.
# Uso desde la raíz del proyecto:  npm run docker:up

name: notecore

services:
  postgres:
    image: postgres:18-alpine
    container_name: notecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expuesto solo en localhost: la base de datos nunca escucha en la red.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ espera el montaje en `/var/lib/postgresql` (no en `.../data`):
      # coloca los datos en un subdirectorio por versión mayor, lo que permite
      # `pg_upgrade --link` en futuras actualizaciones sin cruzar el punto de montaje.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: notecore-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3101
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      # Dominio padre compartido por la web y la API: sin esto la cookie de sesión que
      # pone `api.notecore` no viaja a `notecore`, y la web no reconoce la sesión.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # URL pública de la web: la base de los enlaces de compartición y de los QR.
      WEB_URL: ${WEB_URL:-}
      # Prefijo por el que el NAVEGADOR alcanza la API (`/api` en producción, por el
      # rewrite de Next). Define el path de la cookie de refresco: si no coincide con la
      # URL que pide el navegador, la cookie no viaja y la sesión de la web se cae.
      WEB_API_PREFIX: ${WEB_API_PREFIX:-}
      # Actualizador de la app fuera de la tienda (Fase 17). Apagado por defecto: las
      # tiendas prohíben que una app se autoactualice, así que el día de subir a Play Store
      # esta variable se queda en `false` y el mecanismo deja de existir para todos los
      # teléfonos ya instalados, sin publicar una versión nueva.
      UPDATER_ENABLED: ${UPDATER_ENABLED:-false}
      # Dentro del contenedor siempre es esta ruta; lo que cambia es qué directorio del
      # host se monta ahí (`RELEASES_HOST_DIR`). Son dos variables distintas a propósito:
      # con una sola, cambiar dónde están los APK en el host cambiaría también la ruta que
      # la API busca dentro del contenedor, y dejaría de encontrarlos.
      RELEASES_DIR: /releases
      # De dónde cuelga el enlace de descarga del APK. Absoluto porque lo abre el gestor de
      # descargas de Android, que no tiene origen del que derivar una ruta relativa.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
    ports:
      - '${API_PORT:-3101}:3101'
    volumes:
      # Los APK publicados. Es un montaje del host y no un volumen con nombre a propósito:
      # publicar una versión es copiar dos archivos ahí desde fuera, sin entrar al
      # contenedor. Solo lectura: la API sirve el binario, nunca lo escribe.
      - ${RELEASES_HOST_DIR:-../releases}:/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3101}
        # La versión de la web para el panel de la Fase 25. Se pasa en la compilación
        # porque `NEXT_PUBLIC_*` se incrusta en el bundle; por defecto `dev`, que es lo
        # correcto en la máquina de desarrollo.
        NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
    container_name: notecore-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  # Túnel de Cloudflare: publica la web y la API en HTTPS sin abrir un solo puerto
  # del router. El enrutamiento (qué hostname va a qué servicio) vive en el panel de
  # Cloudflare, no aquí:
  #   notecore.ourocore.net      → http://web:3000
  #   api.notecore.ourocore.net  → http://api:3101
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: notecore-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
      - web


volumes:
  postgres_data:
    name: notecore_postgres_data
